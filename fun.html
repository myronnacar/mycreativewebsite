<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Memorable Extra - Arielle</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      height: 100vh;
      overflow: hidden;
      position: relative;
      color: #fff;
    }

    .modal {
      width: 420px;
      max-width: 90vw;
      background: #ffffff;
      color: #111827;
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
      padding: 24px;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      transition: all 0.3s ease;
    }

    .close-btn {
      position: absolute;
      top: 12px;
      right: 14px;
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: #e5e7eb;
      font-size: 18px;
      cursor: pointer;
      font-weight: bold;
    }

    h1 {
      margin-top: 16px;
      margin-bottom: 10px;
      font-size: 24px;
    }

    p {
      margin: 10px 0;
      line-height: 1.5;
    }

    .message {
      margin-top: 18px;
      font-weight: bold;
      color: #1d4ed8;
      min-height: 24px;
    }

    .hidden {
      display: none;
    }

    .footer {
      margin-top: 16px;
      font-size: 14px;
      color: #6b7280;
    }

    .thankyou {
      font-size: 26px;
      font-weight: bold;
      color: #1d4ed8;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <!-- FIRST MODAL -->
  <div class="modal" id="modal1">
    <button class="close-btn" id="closeBtn">×</button>

    <h1>Before you leave...</h1>
    <p>Remember this name: <strong>Arielle</strong></p>
    <p>Systems Builder. Data-Driven Marketer. Problem Solver.</p>

    <div class="message" id="message">
      Try closing me if you can 😄
    </div>

    <div class="footer">
      A little extra, because memorable matters.
    </div>
  </div>

  <!-- SECOND MODAL -->
  <div class="modal hidden" id="modal2">
    <h1>Thank You 🙏</h1>
    <p class="thankyou">Thank you for listening!</p>
    <p>I appreciate your time.</p>
  </div>

  <script>
    const closeBtn = document.getElementById("closeBtn");
    const modal1 = document.getElementById("modal1");
    const modal2 = document.getElementById("modal2");
    const message = document.getElementById("message");

    let attempts = 0;

    const responses = [
      "Not yet 😄",
      "You still need a systems builder.",
      "Also a data-driven marketer.",
      "And definitely a problem solver.",
      "Good presentations should be memorable.",
      "You’re getting closer...",
      "Still here. Just like strong branding.",
      "Almost there.",
      "One more after this.",
      "Okay, now you may close me."
    ];

    function moveModalRandomly() {
      const modalWidth = modal1.offsetWidth;
      const modalHeight = modal1.offsetHeight;

      const maxX = window.innerWidth - modalWidth;
      const maxY = window.innerHeight - modalHeight;

      const randomX = Math.random() * maxX;
      const randomY = Math.random() * maxY;

      modal1.style.left = randomX + "px";
      modal1.style.top = randomY + "px";
      modal1.style.transform = "none";
    }

    closeBtn.addEventListener("click", () => {
      attempts++;

      if (attempts < 10) {
        message.textContent = responses[attempts - 1];
        moveModalRandomly();
      } else {
        message.textContent = responses[9];

        // Hide first modal
        modal1.classList.add("hidden");

        // Show thank you modal
        modal2.classList.remove("hidden");
      }
    });
  </script>

</body>
</html>
