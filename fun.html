<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Memorable Extra - Arielle</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      height: 100vh;
      overflow: hidden;
      position: relative;
      color: #fff;
    }

    .alert-box {
      width: 420px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
}

.alert-header {
  padding: 12px 16px;
  font-weight: 600;
  color: #555;
  border-bottom: 1px solid #eee;
}

.alert-body {
  padding: 20px;
  font-size: 15px;
  color: #111;
}

.alert-footer {
  padding: 12px 16px;
  display: flex;
  justify-content: flex-end;
}

.alert-footer button {
  background: #007aff;
  color: white;
  border: none;
  padding: 8px 18px;
  border-radius: 8px;
  font-weight: 500;
  cursor: pointer;
}

.alert-footer button:hover {
  background: #0063d1;
}

.hidden {
  display: none;
}

    .close-btn {
      margin-top: 16px;
      padding: 10px 18px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 14px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s ease;
    }

.close-btn:hover {
  background: #1d4ed8;
    }
  

    h1 {
      margin-top: 16px;
      margin-bottom: 10px;
      font-size: 24px;
    }

    p {
      margin: 10px 0;
      line-height: 1.5;
    }

    .message {
      margin-top: 18px;
      font-weight: bold;
      color: #1d4ed8;
      min-height: 24px;
    }

    .hidden {
      display: none;
    }

    .footer {
      margin-top: 16px;
      font-size: 14px;
      color: #6b7280;
    }

    .thankyou {
      font-size: 26px;
      font-weight: bold;
      color: #1d4ed8;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <!-- FIRST MODAL -->
  <div class="alert-box" id="modal1">
  <div class="alert-header">mycreativewebsite.com says</div>
  <div class="alert-body">
    This is an alert! Click "Close" to close it.
  </div>
  <div class="alert-footer">
    <button id="closeBtn">Close</button>
  </div>
</div>

<div class="alert-box hidden" id="modal2">
  <div class="alert-header">mycreativewebsite.com says</div>
  <div class="alert-body">
    Thank you for listening 🙏
  </div>
  <div class="alert-footer">
    <button onclick="window.close()">Close</button>
  </div>
</div>

  <!-- SECOND MODAL -->
  <div class="modal hidden" id="modal2">
    <h1>Thank You 🙏</h1>
    <p class="thankyou">Thank you for listening!</p>
    <p>I appreciate your time.</p>
  </div>

  <script>
    const closeBtn = document.getElementById("closeBtn");
    const modal1 = document.getElementById("modal1");
    const modal2 = document.getElementById("modal2");
    const message = document.getElementById("message");

    let attempts = 0;

    const responses = [
      "Not yet 😄",
      "You still need a systems builder.",
      "Also a data-driven marketer.",
      "And definitely a problem solver.",
      "Good presentations should be memorable.",
      "You’re getting closer...",
      "Still here. Just like strong branding.",
      "Almost there.",
      "One more after this.",
      "Okay, now you may close me."
    ];

    function moveModalRandomly() {
      const modalWidth = modal1.offsetWidth;
      const modalHeight = modal1.offsetHeight;

      const maxX = window.innerWidth - modalWidth;
      const maxY = window.innerHeight - modalHeight;

      const randomX = Math.random() * maxX;
      const randomY = Math.random() * maxY;

      modal1.style.left = randomX + "px";
      modal1.style.top = randomY + "px";
      modal1.style.transform = "none";
    }

    closeBtn.addEventListener("click", () => {
      attempts++;

      if (attempts < 10) {
        message.textContent = responses[attempts - 1];
        moveModalRandomly();
      } else {
        message.textContent = responses[9];

        // Hide first modal
        modal1.classList.add("hidden");

        // Show thank you modal
        modal2.classList.remove("hidden");
      }
    });
  </script>

</body>
</html>
