<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fun Alert</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(135deg, #f4c29a, #8a2be2, #3aa0ff);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      position: relative;
    }

    .alert-box {
      width: 520px;
      max-width: 90vw;
      background: #f5f5f7;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      overflow: hidden;
      transition: left 0.25s ease, top 0.25s ease;
    }

    .alert-header {
      padding: 18px 20px 8px;
      font-size: 20px;
      font-weight: 600;
      color: #444;
    }

    .alert-body {
      padding: 0 20px 24px;
      font-size: 18px;
      color: #111;
      line-height: 1.5;
    }

    .alert-footer {
      padding: 0 20px 18px;
      display: flex;
      justify-content: flex-end;
    }

    .alert-footer button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .alert-footer button:hover {
      background: #2563eb;
    }

    .modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 40px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-width: 320px;
      animation: fadeIn 0.4s ease;
    }

    .modal h1 {
      margin-top: 0;
      margin-bottom: 10px;
      color: #111;
    }

    .thankyou {
      font-size: 18px;
      margin-bottom: 10px;
      color: #2563eb;
      font-weight: 600;
    }

    .modal p {
      margin: 0;
      color: #444;
      line-height: 1.5;
    }

    .hidden {
      display: none;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translate(-50%, -60%);
      }
      to {
        opacity: 1;
        transform: translate(-50%, -50%);
      }
    }
  </style>
</head>
<body>
  <div class="alert-box" id="modal1">
    <div class="alert-header">mycreativewebsite.com says</div>
    <div class="alert-body" id="message">
      This is an alert! Click "Close" to close it.
    </div>
    <div class="alert-footer">
      <button id="closeBtn">Close</button>
    </div>
  </div>

  <div class="modal hidden" id="modal2">
    <h1>Thank You 🙏</h1>
    <p class="thankyou">Thank you for listening!</p>
    <p>I appreciate your time.</p>
  </div>

  <script>
    const closeBtn = document.getElementById("closeBtn");
    const modal1 = document.getElementById("modal1");
    const modal2 = document.getElementById("modal2");
    const message = document.getElementById("message");

    let attempts = 0;

    const responses = [
      "Not yet 😄",
      "Still trying to close it?",
      "Almost... but not really.",
      "Good things take persistence.",
      "Memorable, right?",
      "You are getting closer.",
      "Just one more skill check.",
      "Still here 👀",
      "Okay, almost done."
    ];

    function moveModalRandomly() {
      const modalWidth = modal1.offsetWidth;
      const modalHeight = modal1.offsetHeight;

      const maxX = window.innerWidth - modalWidth;
      const maxY = window.innerHeight - modalHeight;

      const randomX = Math.max(0, Math.random() * maxX);
      const randomY = Math.max(0, Math.random() * maxY);

      modal1.style.left = randomX + "px";
      modal1.style.top = randomY + "px";
      modal1.style.transform = "none";
    }

    closeBtn.addEventListener("click", () => {
      attempts++;

      if (attempts < 10) {
        message.textContent = responses[attempts - 1];
        moveModalRandomly();
      } else {
        modal1.classList.add("hidden");
        modal2.classList.remove("hidden");
      }
    });
  </script>
</body>
</html>
