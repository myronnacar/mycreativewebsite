!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Interactive Experience</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: #0466c8);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      position: relative;
      color: white;
    }

    /* MAIN ALERT */
    .alert-box {
      width: 520px;
      max-width: 90vw;
      background: #f5f5f7;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #111;
      overflow: hidden;
      transition: left 0.25s ease, top 0.25s ease;
    }

    .alert-header {
      padding: 16px 20px 8px;
      font-size: 16px;
      font-weight: 600;
      color: #666;
    }

    .alert-body {
      padding: 0 20px 20px;
      font-size: 18px;
      line-height: 1.5;
    }

    .alert-footer {
      padding: 0 20px 18px;
      display: flex;
      justify-content: flex-end;
    }

    .alert-footer button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }

    .alert-footer button:hover {
      background: #2563eb;
    }

    /* THANK YOU MODAL */
    .modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 40px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      color: #111;
      animation: fadeIn 0.4s ease;
    }

    .modal h1 {
      margin-bottom: 10px;
    }

    .thankyou {
      font-size: 18px;
      font-weight: 600;
      color: #2563eb;
      margin-bottom: 8px;
    }

    .hidden {
      display: none;
    }

    /* FLASH */
    #flash {
      position: fixed;
      inset: 0;
      background: rgba(255, 0, 0, 0.2);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.1s ease;
    }

    #flash.active {
      opacity: 1;
    }

    /* SHAKE */
    body.shake {
      animation: shake 0.2s linear 2;
    }

    @keyframes shake {
      0% { transform: translate(0,0); }
      25% { transform: translate(-4px,2px); }
      50% { transform: translate(4px,-2px); }
      75% { transform: translate(-3px,1px); }
      100% { transform: translate(0,0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translate(-50%, -60%); }
      to { opacity: 1; transform: translate(-50%, -50%); }
    }
  </style>
</head>

<body>

  <!-- FLASH EFFECT -->
  <div id="flash"></div>

  <!-- SOUND -->
  <audio id="beepSound" preload="auto">
    <source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" type="audio/ogg">
  </audio>

  <!-- MAIN MODAL -->
  <div class="alert-box" id="modal1">
    <div class="alert-header" id="headerText">mycreativewebsite.com says</div>
    <div class="alert-body" id="message">
      This is part of the experience 😄
    </div>
    <div class="alert-footer">
      <button id="closeBtn">Close</button>
    </div>
  </div>

  <!-- FINAL MODAL -->
  <div class="modal hidden" id="modal2">
    <h1>Thank You 🙏</h1>
    <p class="thankyou">Thank you for listening!</p>
    <p>I appreciate your time.</p>
  </div>

  <script>
    const closeBtn = document.getElementById("closeBtn");
    const modal1 = document.getElementById("modal1");
    const modal2 = document.getElementById("modal2");
    const message = document.getElementById("message");
    const headerText = document.getElementById("headerText");
    const beep = document.getElementById("beepSound");
    const flash = document.getElementById("flash");

    let attempts = 0;

    const responses = [
      "Access denied 😄",
      "Close request rejected.",
      "Nice try.",
      "Still not closing.",
      "You're committed now 👀",
      "Presentation takeover in progress...",
      "Relax... just kidding 😄",
      "Almost done.",
      "Last one..."
    ];

    function moveModal() {
      const w = modal1.offsetWidth;
      const h = modal1.offsetHeight;

      const x = Math.random() * (window.innerWidth - w);
      const y = Math.random() * (window.innerHeight - h);

      modal1.style.left = x + "px";
      modal1.style.top = y + "px";
      modal1.style.transform = "none";
    }

    function flashScreen() {
      flash.classList.add("active");
      setTimeout(() => flash.classList.remove("active"), 100);
    }

    function shake() {
      document.body.classList.add("shake");
      setTimeout(() => document.body.classList.remove("shake"), 300);
    }

    closeBtn.addEventListener("click", () => {
      attempts++;

      // play sound
      beep.currentTime = 0;
      beep.play().catch(() => {});

      flashScreen();
      shake();

      if (attempts < 10) {
        message.textContent = responses[attempts - 1];

        if (attempts >= 5) {
          headerText.textContent = "SYSTEM NOTICE";
        }

        moveModal();
      } else {
        modal1.classList.add("hidden");
        modal2.classList.remove("hidden");
      }
    });
  </script>

</body>
</html>
